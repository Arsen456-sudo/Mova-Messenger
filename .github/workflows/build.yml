name: Build Mova

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://wrfobivetcqxstqugvsg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7H-kTsq5rfvjy8KbXkt6OQ_bypN6ZWb
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure local Android build properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\nsupabase.url=%s\nsupabase.publishableKey=%s\n' \
            "$ANDROID_HOME" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
      - name: Assemble debug APK
        run: bash ./gradlew :androidApp:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mova-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Configure iOS build settings
        run: cp ios/Supabase.xcconfig.example ios/Supabase.xcconfig
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/Mova.xcodeproj
          -scheme Mova
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: mova-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Mova.app
          if-no-files-found: error
