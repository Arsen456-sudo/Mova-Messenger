name: Build Mova iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Configure iOS build settings
        run: cp ios/Supabase.xcconfig.example ios/Supabase.xcconfig
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/Mova.xcodeproj
          -scheme Mova
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: mova-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Mova.app
          if-no-files-found: error
